name: Version and release main source

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: main-source-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package source
        run: |
          git fetch origin main --tags
          git checkout -B main origin/main

          latest_tag=$(git tag --list 'v[0-9]*' --sort=-version:refname | head -n 1)
          if [[ -z "$latest_tag" ]]; then
            echo "No existing vMAJOR.MINOR.PATCH tag was found." >&2
            exit 1
          fi
          version=${latest_tag#v}
          IFS=. read -r major minor patch <<< "$version"
          next_version="$major.$minor.$((patch + 1))"
          next_tag="v$next_version"

          current_version=$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')
          if [[ "$current_version" != "$next_version" ]]; then
            python3 - "$next_version" <<'PY'
          import json
          import pathlib
          import sys

          manifest = pathlib.Path("manifest.json")
          data = json.loads(manifest.read_text(encoding="utf-8"))
          data["version"] = sys.argv[1]
          manifest.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          PY

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add manifest.json
            git commit -m "chore: release $next_tag"
            git push origin HEAD:main
          fi

          release_sha=$(git rev-parse HEAD)
          git archive --format=zip --prefix=larpblox-extension/ --output=Larpblox-Extension-$next_version.zip "$release_sha"
          echo "RELEASE_VERSION=$next_version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$next_tag" >> "$GITHUB_ENV"
          echo "RELEASE_SHA=$release_sha" >> "$GITHUB_ENV"

      - name: Package remote website and loader
        run: |
          python3 scripts/package-website.py
          mkdir -p /tmp/larpblox-loader/larpblox-extension
          cp website-bundle.json /tmp/larpblox-loader/larpblox-extension/
          archive="$PWD/Larpblox-Extension-$RELEASE_VERSION.zip"
          (cd /tmp/larpblox-loader && zip -u "$archive" larpblox-extension/website-bundle.json)

      - name: Publish versioned and latest releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$RELEASE_TAG" "Larpblox-Extension-$RELEASE_VERSION.zip" website-release/* \
            --target "$RELEASE_SHA" \
            --title "Larpblox Extension $RELEASE_VERSION" \
            --notes "Version $RELEASE_VERSION from the main branch. Download the source ZIP and extract it to use the unpacked Chrome extension." \
            --prerelease \
            --latest=false

          git tag -f main-latest "$RELEASE_SHA"
          git push --force origin refs/tags/main-latest

          if gh release view main-latest >/dev/null 2>&1; then
            gh release delete-asset main-latest Larpblox-Extension-main.zip --yes || true
            gh release edit main-latest \
              --title "Larpblox Extension — Main (latest $RELEASE_VERSION)" \
              --notes "Current source snapshot from the main branch. Versioned release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG" \
              --prerelease
            gh release upload main-latest "Larpblox-Extension-$RELEASE_VERSION.zip" --clobber
          else
            gh release create main-latest "Larpblox-Extension-$RELEASE_VERSION.zip" \
              --target "$RELEASE_SHA" \
              --title "Larpblox Extension — Main (latest $RELEASE_VERSION)" \
              --notes "Current source snapshot from the main branch. Versioned release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG" \
              --prerelease \
              --latest=false
          fi

          # Publish the pointer after its versioned payload is available.
          gh release upload main-latest website-release/website-latest.json --clobber
